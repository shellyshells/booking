[package]
name = "room-booking-system"
version = "1.0.0"
edition = "2021"
authors = ["Room Booking Team"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
eframe = "0.28"
egui = "0.28"
egui_extras = "0.28"