[package]
name = "room-reservation-system"
version = "1.0.0"
edition = "2021"
authors = ["Room Reservation System"]
description = "A room reservation system demonstrating advanced OOP design patterns in Rust"

[dependencies]
# Simple HTTP server with minimal dependencies
tiny_http = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging
log = "0.4"
env_logger = "0.10"

# For thread-safe global state (Singleton pattern)
once_cell = "1.18"

[profile.release]
opt-level = 3
lto = true
